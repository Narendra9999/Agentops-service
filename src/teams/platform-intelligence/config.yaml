agent:
  name: platform_intelligence
  version: 1.0.0
  description: Supervisor with platform knowledge and cost intelligence specialists
naming:
  schema: agentops_multi
  audit_schema: agentops_multi_audit
  agent_endpoint: fe-platform-intelligence
  catalog: fevm_catalog_naren
llm:
  endpoint: system.ai.claude-sonnet-4-6
  api: ai_gateway
multi_agent:
  pattern: langgraph_supervisor
  ownership: customer
  settings:
    genie_space_id: 01f1d6efcecd1620b04cf487817675b7
    observer_enabled: true
    max_steps: 60
    platform_endpoint: ''
    cost_endpoint: ''
    platform_mode: in_process
    docs_index: fevm_catalog_naren.agentops_multi.platform_docs_index
    platform_model: system.ai.gpt-oss-120b
    memory_enabled: true
    # Playground/direct requests can query workers without accessing persistent memory.
    # A supplied context must always pass signature/expiry/message verification.
    unsigned_context_policy: stateless
    memory_endpoint: projects/fe-agentops-multi/branches/production/endpoints/primary
    memory_ttl_days: 90
  agents:
    supervisor:
      role: supervisor
    platform_docs:
      role: worker
      display_name: Platform knowledge
      transport: in_process
      binding: settings.docs_index
    cost_estimation:
      role: worker
      display_name: Cost intelligence
      mode: STANDARD
      usage_coverage: unavailable
      transport: genie_agent
      binding: settings.genie_space_id
guardrails:
  enabled: true
  pre_llm:
    enabled_checks:
    - input_length_min
    - input_length_max
    - pii
    - injection
    max_input_length: 12000
    min_input_length: 2
  post_llm:
    enabled_checks:
    - pii_leakage
    - compliance
    - quality
    min_response_length: 2
# Automatic shared-store recall stays off: the App supplies signed Lakebase history.
session_history:
  enabled: false
# Supervisor explicitly curates Lakebase file memory via multi_agent.settings above.
long_term_memory:
  enabled: false
tracing:
  # Created/resolved by registration; the generated ID is passed to serving and eval.
  experiment_name: /Shared/agentops-platform-intelligence
  uc_trace_storage_enabled: false
  default_tags:
    agentops.system_id: platform-intelligence
    agentops.pattern: langgraph_supervisor
deployment:
  environment_vars:
    # Explicit FEVM runtime identity; provision/rebind this and its grants per workspace.
    DATABRICKS_HOST: 'https://fevm-classic-stable-naren.cloud.databricks.com'
    DATABRICKS_CLIENT_ID: 'e3bcf75e-7b34-4026-8860-d5e4423ea2b7'
    DATABRICKS_CLIENT_SECRET: '{{secrets/fe-agentops-multi/oauth-client-secret}}'
    AGENT_CONTEXT_SIGNING_KEY: '{{secrets/fe-agentops-context/signing-key}}'
    AGENTOPS_ENVIRONMENT: fevm
  serving_scale_to_zero: true
  champion:
    workload_size: Small
    traffic_percentage: 100
  ai_gateway:
    safety_enabled: true
    inference_tables_enabled: true
    rate_limit_per_user_per_minute: 10
    rate_limit_per_endpoint_per_minute: 100
    usage_tracking_enabled: true
model:
  prompt_registry_enabled: false
  env_pack: false
  promote_on_registration: false
  pip_dependency_mode: replace
  pip_dependencies_file: configs/requirements.lock
  resources:
  - type: vector_search_index
    name_from: multi_agent.settings.docs_index
    when:
      multi_agent.settings.platform_mode: in_process
  - type: serving_endpoint
    name_from: multi_agent.settings.platform_endpoint
    when:
      multi_agent.settings.platform_mode: remote
  - type: genie_space
    name_from: multi_agent.settings.genie_space_id
    when:
      multi_agent.settings.cost_endpoint: ''
  - type: serving_endpoint
    name_from: multi_agent.settings.cost_endpoint
    when_not:
      multi_agent.settings.cost_endpoint: ''
  - type: serving_endpoint
    name_from: llm.endpoint
    when:
      llm.api: model_serving
  - type: serving_endpoint
    name_from: multi_agent.settings.platform_model
    when:
      llm.api: model_serving
      multi_agent.settings.platform_mode: in_process

evaluation:
  custom_scorers:
  - name: routing
    file: routing.py
    threshold: 0.8
  scorer_mode: builtin,domain
  judge_model: databricks-gpt-oss-120b
  quality_gate_threshold: 0.8
  builtin_scorers:
    correctness:
      enabled: true
      threshold: 0.8
    relevance_to_query:
      enabled: true
      threshold: 0.8
    safety:
      enabled: true
      threshold: 0.8
  domain_scorers:
  - name: cost_grounding
    type: guidelines
    enabled: true
    rules:
    - Cost estimates state assumptions and missing workload inputs. Never invent rates
      or an unsupported numerical quote.
  - name: platform_evidence
    type: guidelines
    enabled: true
    rules:
    - When the response provides platform guidance, it cites retrieved Databricks documentation.
      Cost-only input clarification does not require platform documentation. Never claim
      changes to cases or infrastructure.

pipeline:
  request_timeout_seconds: 240
  sanity_queries:
    pre_deployment: 'Which region is recorded? Read memory only; do not call a worker.'
    deployment: 'What is Unity Catalog?'
  context_signing_secret:
    scope: fe-agentops-context
    key: signing-key
smoke_test:
  test_queries:
    valid_query: Explain MLflow tracing for LangGraph with a Databricks documentation citation.
    grounding: Explain Auto Loader ingestion with a Databricks documentation citation.
    short_input: '?'
