evaluation:
  custom_scorers:
  - name: routing
    file: routing.py
    threshold: 0.8
  scorer_mode: builtin,domain
  judge_model: databricks-gpt-oss-120b
  quality_gate_threshold: 0.8
  builtin_scorers:
    correctness:
      enabled: true
      threshold: 0.8
    relevance_to_query:
      enabled: true
      threshold: 0.8
    safety:
      enabled: true
      threshold: 0.8
  domain_scorers:
  - name: cost_grounding
    type: guidelines
    enabled: true
    rules:
    - Cost estimates state assumptions and missing workload inputs. Never invent rates
      or an unsupported numerical quote.
  - name: platform_evidence
    type: guidelines
    enabled: true
    rules:
    - When the response provides platform guidance, it cites retrieved Databricks documentation.
      Cost-only input clarification does not require platform documentation. Never claim
      changes to cases or infrastructure.

pipeline:
  context_signing_secret:
    scope: fe-agentops-context
    key: signing-key
smoke_test:
  test_queries:
    valid_query: Explain MLflow tracing for LangGraph with a Databricks documentation citation.
    grounding: Explain Auto Loader ingestion with a Databricks documentation citation.
    short_input: '?'
