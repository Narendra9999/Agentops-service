# AgentOPS Main Pipeline
# One job with chained tasks.
#
# Data ingestion and preprocessing are owned by the application teams and run
# before this pipeline. The pipeline assumes the preprocessed source table
# already exists and starts at vector_search_setup.
#
# Flow:
#   vector_search_setup (idempotent — reuses existing endpoint/index if present)
#     → register_model
#     → pre_deployment_eval (loads model via pyfunc, quality gate)
#     → deploy_agent (only runs if pre-eval passes)
#     → smoke_test
#     → post_deployment_eval (tests live endpoint)
#
# Production quality monitoring runs as its own scheduled job, independent of
# this pipeline — see resources/production-monitoring-resource.yml.
#
# If any step fails, downstream steps are skipped.

resources:
  jobs:
    agentops_pipeline:
      name: "agentops-pipeline-${var.team_name}-${bundle.target}"
      email_notifications:
        on_start:
          - ${var.notification_emails}
        on_success:
          - ${var.notification_emails}
        on_failure:
          - ${var.notification_emails}
      job_clusters:
        - job_cluster_key: agentops_cluster
          new_cluster:
            policy_id: ${var.job_cluster_policy_id}
            spark_version: ${var.job_cluster_spark_version}
            node_type_id: ${var.job_cluster_node_type_id}
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            enable_elastic_disk: true
            autoscale:
              max_workers: ${var.job_cluster_autoscale_max_worker}
            aws_attributes:
              first_on_demand: ${var.job_cluster_aws_attributes_first_on_demand}
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              spot_bid_price_percent: 100
              ebs_volume_count: 0
      tasks:
        # ── Step 1: Vector Search Setup (pipeline entry point) ──
        # Data ingestion + preprocessing are owned by the application teams
        # and run before this pipeline. This step assumes the preprocessed
        # source table already exists and reuses any existing vector search
        # endpoint/index (idempotent).
        - task_key: vector_search_setup
          notebook_task:
            notebook_path: ../src/data_preparation/vector_search/notebooks/VectorSearch.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              environment: ${bundle.target}
              preprocessed_data_table: ${var.preprocessed_data_table}
              skip_vector_search_creation: ${var.skip_vector_search_creation}
              vs_endpoint: ${var.vs_endpoint}
              vs_index: ${var.vs_index}
              embedding_model: ${var.embedding_model}
              model_signature_json: ${var.model_signature_json}
              team_name: ${var.team_name}
              skip_vector_search_setup: ${var.skip_vector_search_setup}
          job_cluster_key: agentops_cluster
          libraries:
            - whl: ../dist/agentops_framework-*.whl

        # ── Step 2: Register Model (log + register, no deploy) ──
        - task_key: register_model
          depends_on:
            - task_key: vector_search_setup
          notebook_task:
            notebook_path: ../src/agent_development/agent/notebooks/RegisterModel.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              environment: ${bundle.target}
              agent_name: ${var.agent_name}
              llm_endpoint: ${var.llm_endpoint}
              sql_warehouse_name: ${var.sql_warehouse_name}
              vs_endpoint: ${var.vs_endpoint}
              vs_index: ${var.vs_index}
              embedding_model: ${var.embedding_model}
              team_name: ${var.team_name}
              skip_register_model: ${var.skip_register_model}
              mlflow_tracing_uc_enabled: ${var.mlflow_tracing_uc_enabled}
          # Serverless env_pack is required for offline model dependency packaging.
          environment_key: agentops_register_model_env

        # ── Step 3: Pre-Deployment Eval (loads model via pyfunc) ─
        - task_key: pre_deployment_eval
          depends_on:
            - task_key: register_model
          notebook_task:
            notebook_path: ../src/agent_development/agent_evaluation/notebooks/PreDeploymentEval.py
            base_parameters:
              agent_name: ${var.agent_name}
              catalog: ${var.catalog}
              schema: ${var.schema}
              audit_schema: ${var.audit_schema}
              environment: ${bundle.target}
              eval_golden_table: ${var.eval_golden_table}
              eval_adversarial_table: ${var.eval_adversarial_table}
              eval_results_table: ${var.eval_results_table}
              team_name: ${var.team_name}
              mlflow_experiment_id: "{{tasks.register_model.values.mlflow_experiment_id}}"
              skip_pre_deployment_eval: ${var.skip_pre_deployment_eval}
          job_cluster_key: agentops_cluster
          libraries:
            - whl: ../dist/agentops_framework-*.whl

        # ── Step 4: Deploy Agent (endpoint) ─────────────────────
        - task_key: deploy_agent
          depends_on:
            - task_key: pre_deployment_eval
          notebook_task:
            notebook_path: ../src/agent_development/agent/notebooks/DeployAgent.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              agent_name: ${var.agent_name}
              champion_model_version: ${var.champion_model_version}
              champion_workload_size: ${var.champion_workload_size}
              champion_traffic_percentage: ${var.champion_traffic_percentage}
              challenger_enabled: ${var.challenger_enabled}
              challenger_model_version: ${var.challenger_model_version}
              challenger_workload_size: ${var.challenger_workload_size}
              challenger_traffic_percentage: ${var.challenger_traffic_percentage}
              serving_scale_to_zero: ${var.serving_scale_to_zero}
              agent_endpoint: ${var.agent_endpoint}
              ai_gateway_safety_enabled: ${var.ai_gateway_safety_enabled}
              inference_tables_enabled: ${var.inference_tables_enabled}
              rate_limit_per_user_per_minute: ${var.rate_limit_per_user_per_minute}
              rate_limit_per_endpoint_per_minute: ${var.rate_limit_per_endpoint_per_minute}
              usage_tracking_enabled: ${var.usage_tracking_enabled}
              environment: ${bundle.target}
              team_name: ${var.team_name}
              mlflow_experiment_id: "{{tasks.register_model.values.mlflow_experiment_id}}"
              skip_deploy_agent: ${var.skip_deploy_agent}
          job_cluster_key: agentops_cluster
          libraries:
            - whl: ../dist/agentops_framework-*.whl

        # ── Step 5: Post-Deployment Smoke Test ──────────────────
        - task_key: smoke_test
          depends_on:
            - task_key: deploy_agent
          notebook_task:
            notebook_path: ../src/agent_development/agent_evaluation/notebooks/SmokeTest.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              agent_name: ${var.agent_name}
              audit_schema: ${var.audit_schema}
              environment: ${bundle.target}
              vs_endpoint: ${var.vs_endpoint}
              vs_index: ${var.vs_index}
              agent_endpoint: ${var.agent_endpoint}
              team_name: ${var.team_name}
              skip_smoke_test: ${var.skip_smoke_test}
          job_cluster_key: agentops_cluster
          libraries:
            - whl: ../dist/agentops_framework-*.whl

        # ── Step 6: Post-Deployment Evaluation (live endpoint) ──
        - task_key: post_deployment_eval
          depends_on:
            - task_key: smoke_test
          notebook_task:
            notebook_path: ../src/agent_development/agent_evaluation/notebooks/PostDeploymentEval.py
            base_parameters:
              agent_name: ${var.agent_name}
              catalog: ${var.catalog}
              schema: ${var.schema}
              audit_schema: ${var.audit_schema}
              environment: ${bundle.target}
              eval_golden_table: ${var.eval_golden_table}
              eval_adversarial_table: ${var.eval_adversarial_table}
              eval_results_table: ${var.eval_results_table}
              agent_endpoint: ${var.agent_endpoint}
              team_name: ${var.team_name}
              mlflow_experiment_id: "{{tasks.register_model.values.mlflow_experiment_id}}"
              skip_post_deployment_eval: ${var.skip_post_deployment_eval}
          job_cluster_key: agentops_cluster
          libraries:
            - whl: ../dist/agentops_framework-*.whl

      environments:
        - environment_key: agentops_register_model_env
          spec:
            environment_version: "4"

