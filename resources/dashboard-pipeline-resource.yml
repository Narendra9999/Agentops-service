# AgentOPS Dashboard Pipeline
#
# Run this job separately after endpoint traffic has created/populated
# the payload inference table.

resources:
  jobs:
    agentops_dashboard_pipeline:
      name: "agentops-dashboard-pipeline-${var.team_name}-${bundle.target}"
      email_notifications:
        on_start:
          - ${var.notification_emails}
        on_success:
          - ${var.notification_emails}
        on_failure:
          - ${var.notification_emails}
      job_clusters:
        - job_cluster_key: agentops_cluster
          new_cluster:
            policy_id: ${var.job_cluster_policy_id}
            spark_version: ${var.job_cluster_spark_version}
            node_type_id: ${var.job_cluster_node_type_id}
            data_security_mode: SINGLE_USER
            runtime_engine: STANDARD
            enable_elastic_disk: true
            autoscale:
              max_workers: ${var.job_cluster_autoscale_max_worker}
            aws_attributes:
              first_on_demand: ${var.job_cluster_aws_attributes_first_on_demand}
              availability: SPOT_WITH_FALLBACK
              zone_id: auto
              spot_bid_price_percent: 100
              ebs_volume_count: 0
      tasks:
        - task_key: create_agent_dashboard
          notebook_task:
            notebook_path: ../src/agent_deployment/monitoring/notebooks/CreateAgentDashboard.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              agent_endpoint: ${var.agent_endpoint}
              team_name: ${var.team_name}
          job_cluster_key: agentops_cluster
        - task_key: create_production_quality_dashboard
          notebook_task:
            notebook_path: ../src/agent_deployment/monitoring/notebooks/CreateProductionQualityDashboard.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              results_table: ${var.production_quality_results_table}
              team_name: ${var.team_name}
          job_cluster_key: agentops_cluster
          libraries:
            - whl: ../dist/agentops_framework-*.whl
