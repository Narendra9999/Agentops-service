bundle:
  name: fe-platform-agent-team

variables:
  endpoint_name:
    description: Existing deployed ResponsesAgent endpoint name
  context_secret_scope:
    default: fe-agentops-context
  context_secret_key:
    default: signing-key

resources:
  apps:
    chat:
      name: fe-platform-team-${bundle.target}
      description: Platform engineering agent team — synthetic FE demo
      source_code_path: ./app
      resources:
        - name: agent-endpoint
          serving_endpoint:
            name: ${var.endpoint_name}
            permission: CAN_QUERY
        - name: context-signing-key
          secret:
            scope: ${var.context_secret_scope}
            key: ${var.context_secret_key}
            permission: READ

targets:
  fevm:
    default: true
    mode: development
